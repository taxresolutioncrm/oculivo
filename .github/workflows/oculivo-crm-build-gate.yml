name: Oculivo CRM release verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned app dependencies
        run: npm install --no-save --no-audit --no-fund
      - name: Verify application contracts
        run: npm run verify:closeout
      - name: Verify every CRM tab has responsive visual coverage
        run: npm run verify:ui
      - name: Compile and build production CRM
        run: npm run build
