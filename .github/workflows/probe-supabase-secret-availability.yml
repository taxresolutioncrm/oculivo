name: Probe Supabase Secret Availability

on:
  push:
    branches:
      - true-final-sandbox-closeout
    paths:
      - '.github/workflows/probe-supabase-secret-availability.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      A: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      B: ${{ secrets.OCULIVO_SUPABASE_ACCESS_TOKEN }}
      C: ${{ secrets.ARCVENA_SUPABASE_ACCESS_TOKEN }}
      D: ${{ secrets.GROUNDIVO_SUPABASE_ACCESS_TOKEN }}
      E: ${{ secrets.P7_SUPABASE_ACCESS_TOKEN }}
      F: ${{ secrets.SUPABASE_TOKEN }}
      G: ${{ secrets.SUPABASE_PAT }}
      H: ${{ secrets.ROMYLABS_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          found=0
          for key in A B C D E F G H; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              echo "$key=present"
              found=1
            else
              echo "$key=missing"
            fi
          done
          exit $((1-found))
