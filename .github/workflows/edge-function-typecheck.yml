name: Edge Function Typecheck

on:
  push:
    branches:
      - true-final-sandbox-closeout
    paths:
      - '.github/workflows/edge-function-typecheck.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Oculivo Edge Functions
        run: |
          set -e
          deno check supabase/functions/oculivo-ai/index.ts
          deno check supabase/functions/phone-session/index.ts
          deno check supabase/functions/send-email/index.ts
          deno check supabase/functions/send-sms/index.ts
          deno check supabase/functions/oculivo-support-api/index.ts
