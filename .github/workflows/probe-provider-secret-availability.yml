name: Probe Oculivo Provider Secret Availability

on:
  push:
    branches:
      - true-final-sandbox-closeout
    paths:
      - '.github/workflows/probe-provider-secret-availability.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OCULIVO_AI_MODEL: ${{ secrets.OCULIVO_AI_MODEL }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      OCULIVO_FROM_EMAIL: ${{ secrets.OCULIVO_FROM_EMAIL }}
      SIGNALWIRE_PROJECT_ID: ${{ secrets.SIGNALWIRE_PROJECT_ID }}
      SIGNALWIRE_AUTH_TOKEN: ${{ secrets.SIGNALWIRE_AUTH_TOKEN }}
      SIGNALWIRE_SPACE_URL: ${{ secrets.SIGNALWIRE_SPACE_URL }}
      OCULIVO_SMS_FROM_NUMBER: ${{ secrets.OCULIVO_SMS_FROM_NUMBER }}
      OCULIVO_VOICE_FROM_NUMBER: ${{ secrets.OCULIVO_VOICE_FROM_NUMBER }}
      OCULIVO_SUPPORT_SECRET: ${{ secrets.OCULIVO_SUPPORT_SECRET }}
      ROMYLABS_SUPPORT_API_URL: ${{ secrets.ROMYLABS_SUPPORT_API_URL }}
    steps:
      - name: Report provider-secret presence only
        shell: bash
        run: |
          missing=0
          required=(OPENAI_API_KEY BREVO_API_KEY OCULIVO_FROM_EMAIL SIGNALWIRE_PROJECT_ID SIGNALWIRE_AUTH_TOKEN SIGNALWIRE_SPACE_URL OCULIVO_SMS_FROM_NUMBER OCULIVO_VOICE_FROM_NUMBER OCULIVO_SUPPORT_SECRET ROMYLABS_SUPPORT_API_URL)
          optional=(OCULIVO_AI_MODEL)
          for key in "${required[@]}"; do
            value="${!key:-}"
            if [ -n "$value" ]; then echo "$key=present"; else echo "$key=missing"; missing=$((missing+1)); fi
          done
          for key in "${optional[@]}"; do
            value="${!key:-}"
            if [ -n "$value" ]; then echo "$key=present(optional)"; else echo "$key=missing(optional-default-used)"; fi
          done
          exit "$missing"
