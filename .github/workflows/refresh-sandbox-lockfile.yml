name: Refresh Sandbox Lockfile
# rerun-router-vite-upgrade
on:
  push:
    paths: ['.github/workflows/refresh-sandbox-lockfile.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RomyLabs Sandbox QA"
          git config user.email "rcruz187@gmail.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "Refresh dependency lockfile"
          git push origin HEAD:"${GITHUB_REF_NAME}"
