name: Final Route Smoke

on:
  push:
    branches:
      - true-final-sandbox-closeout
    paths:
      - '.github/workflows/final-route-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start Vite preview and smoke every CRM route
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/oculivo-preview.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          routes=(/ /schedule /patients /clinical /optical /inbox /phone /team-chat /timeclock /billing /documents /reports /manual /support /login /reset-password)
          for route in "${routes[@]}"; do
            code=$(curl -sS -o /tmp/route.html -w "%{http_code}" "http://127.0.0.1:4173$route")
            echo "$route => $code"
            test "$code" = "200"
            grep -q '<div id="root"></div>' /tmp/route.html
          done
