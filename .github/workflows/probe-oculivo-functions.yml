name: Probe Oculivo Edge Function Existence

on:
  push:
    branches:
      - true-final-sandbox-closeout
    paths:
      - '.github/workflows/probe-oculivo-functions.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe function endpoints without credentials
        shell: bash
        run: |
          set -euo pipefail
          base="https://czejdbdwaumbdepiswcu.supabase.co/functions/v1"
          missing=0
          for fn in oculivo-ai phone-session send-email send-sms oculivo-support-api; do
            code="$(curl -sS -o "/tmp/$fn.txt" -w "%{http_code}" "$base/$fn" || true)"
            body="$(head -c 240 "/tmp/$fn.txt" 2>/dev/null || true)"
            echo "$fn => HTTP $code"
            echo "$body"
            if [ "$code" = "404" ] || [ "$code" = "000" ]; then
              missing=1
            fi
          done
          exit "$missing"
