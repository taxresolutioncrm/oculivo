name: Final Sandbox Certification
on:
  push:
    branches: [true-final-sandbox-closeout]
    paths: ['.github/workflows/final-sandbox-certification.yml']
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Route smoke
        shell: bash
        run: |
          set -euo pipefail
          npx vite preview --host 127.0.0.1 --port 4173 >/tmp/oculivo.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          for route in / /schedule /patients /clinical /optical /inbox /phone /team-chat /timeclock /billing /documents /reports /manual /support /login /reset-password; do
            code=$(curl -sS -o /tmp/r -w "%{http_code}" "http://127.0.0.1:4173$route")
            echo "$route => $code"
            test "$code" = "200"
          done
