name: Oculivo CRM Sandbox Gate
on:
  push:
    branches:
      - sandbox/oculivo-left-nav-fix
jobs:
  sandbox-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
