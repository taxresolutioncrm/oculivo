name: Sandbox Build Only

on:
  push:
    branches:
      - true-final-sandbox-closeout
    paths:
      - '.github/workflows/sandbox-build-only.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
