# Auth is validated inside the function with supabase.auth.getUser().
# Gateway legacy JWT verification can reject newer signing-key tokens before invocation.
[functions.oculivo-ai]
verify_jwt = false

[functions.oculivo-support-api]
verify_jwt = true

[functions.phone-session]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.email-blast-send]
verify_jwt = true

[functions.send-sms]
verify_jwt = true

[functions.universal-esign]
verify_jwt = false

[functions.send-fax]
verify_jwt = false

# Aggregate RomyLabs metrics validates server/user auth inside the function.
[functions.platform-metrics]
verify_jwt = false
